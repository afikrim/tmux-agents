# tmux-agents — optional Kitty appearance profile (Ink / Mint)
#
# STRICTLY OPT-IN. The installer never reads, writes, or applies this file.
# Your shell and terminal configuration are left alone by install/uninstall.
#
# To try it (Kitty only):
#   cat ~/.local/share/tmux-agents/extras/kitty-tmux-agents.conf >> ~/.config/kitty/kitty.conf
#   # then reload Kitty config (default: Ctrl+Shift+F5)
# To revert: delete the appended block from kitty.conf and reload.
# (With a custom install prefix, replace ~/.local/share with <prefix>/share.)
#
# FONTS ARE NOT BUNDLED OR DOWNLOADED. Install a Nerd Font yourself first,
# e.g. via your distro packages or a manual download (Monaspace Nerd Font,
# FiraCode Nerd Font, JetBrainsMono Nerd Font, ...), then set font_family
# below to the font you actually installed. If the named font is missing,
# Kitty falls back silently — check `kitty --debug-config` to confirm.

font_family      Monaspace Neon NF Medium
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Taller cells + breathing room, matching the sidebar layout.
modify_font      cell_height 110%
window_padding_width 12

# Ink background, almost opaque; Mint accents.
background #11151f
foreground #e4eaf4
background_opacity 0.97
selection_background #283b4a
selection_foreground #e4eaf4
cursor #9ce0c0
cursor_text_color #11151f
url_color #a8c9f5
active_border_color #9ce0c0
inactive_border_color #38465d

# Normal palette.
color0  #11151f
color1  #f2a7b5
color2  #9ce0c0
color3  #f2c38b
color4  #a8c9f5
color5  #96a6bd
color6  #9ce0c0
color7  #96a6bd

# Bright palette.
color8  #38465d
color9  #f2a7b5
color10 #9ce0c0
color11 #f2c38b
color12 #a8c9f5
color13 #96a6bd
color14 #9ce0c0
color15 #e4eaf4
